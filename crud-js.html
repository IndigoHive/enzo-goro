<!DOCTYPE html>

<head>
  <style>
    .delete-btn {
      background-color: lightgray;
      color: red;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      display: none;
    }

    .edit-btn {
      background-color: lightgray;
      color: blue;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      display: none;
    }

    .entry:hover .delete-btn,
    .entry:hover .edit-btn {
      display: inline-block;
    }
  </style>
</head>

<body>
  <h3>TABELA</h3>
  <div>
    <table>
      <thead>
        <tr>
          <td>ID</td>
          <td>NOME</td>
          <td>DESCRIÇÃO</td>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
  <hr>
  <h3>INSERT</h3>
  <div>
    <form>
      <label>NOME:</label>
      <input id="insert-nome">
      <label>DESCRIÇÃO:</label>
      <input id="insert-descricao">
      <button type="button" id="insert-btn">INSERT</button>
    </form>
  </div>
</body>

<script>
  const botao = document.getElementById("insert-btn")
  botao.addEventListener("click", insert)

  reload()

  function insert() {
    const nome = document.getElementById("insert-nome").value
    const descricao = document.getElementById("insert-descricao").value
    const id = Number(parseInt(localStorage.getItem("id")) || 0) + 1
    localStorage.setItem("id", id)
    const entry = { id, nome, descricao }
    insertLocalStorage(entry)
  }

  function insertLocalStorage(entry) {
    const list = JSON.parse(localStorage.getItem("list")) || [] 
    list.push(entry)
    localStorage.setItem("list", JSON.stringify(list))
    reload()
  }

  function reload() {
    const table = document.querySelector("tbody")
    table.innerHTML = ""
    const list = JSON.parse(localStorage.getItem("list")) || []
    list.forEach(entry => {table.appendChild(createRow(entry))})
  }

  function createRow(entry) {
    const id = document.createElement("td")
    id.textContent = entry.id
    const nome = document.createElement("td")
    nome.textContent = entry.nome
    const descricao = document.createElement("td")
    descricao.textContent = entry.descricao

    const editButton = document.createElement("button")
    editButton.className = "edit-btn"
    editButton.textContent = "Edit"
    editButton.addEventListener("click", (event) => {
      // ALTERAR LOGICA DE EDIT
      event.stopPropagation()
      editEntry(entry.id)
    })

    const deleteButton = document.createElement("button")
    deleteButton.className = "delete-btn"
    deleteButton.textContent = "X"
    deleteButton.addEventListener("click", (event) => {
      event.stopPropagation()
      deleteEntry(entry.id)
    })

    const row = document.createElement("tr")
    row.className = "entry"
    row.id = "entry-" + id

    row.append(id, nome, descricao, editButton, deleteButton)
    return row
  }

  function editEntry (id) {
    const row = document.getElementById("entry-"+id)
    const list = JSON.parse(localStorage.getItem("list")) || []
    const entry = list.find(e => e.id === id)

    const inputNome = document.createElement("td").appendChild(document.createElement("input"))
    inputNome.id = "edit-nome"
    inputNome.value = entry.nome
    const inputDescricao = document.createElement("td").appendChild(document.createElement("input"))
    inputDescricao.id = "edit-descricao"
    inputDescricao.value = entry.descricao

    row.innerHTML = ""
    row.append("<td>"+id+"</td>", inputNome, inputDescricao)
    const saveButton = document.getElementById("save-btn")
    saveButton.addEventListener("click", () => {
      entry.nome = document.getElementById("edit-nome").value
      entry.descricao = document.getElementById("edit-descricao").value
      localStorage.setItem("list", JSON.stringify(list))
      reload()
    })
  }

  function deleteEntry (id) {
    const list = JSON.parse(localStorage.getItem("list")) || []
    const newList = list.filter(e => e.id !== id)
    localStorage.setItem("list", JSON.stringify(newList))
    reload()
  }

</script>
