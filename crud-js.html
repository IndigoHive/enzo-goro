<!DOCTYPE html>

<head>
  <style>
    .delete-btn {
      background-color: lightgray;
      color: red;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      display: none;
    }

    .edit-btn {
      background-color: lightgray;
      color: blue;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      display: none;
    }

    .entry:hover .delete-btn,
    .entry:hover .edit-btn {
      display: inline-block;
    }
  </style>
</head>

<body>
  <h3>TABELA</h3>
  <div>
    <table>
      <thead>
        <tr>
          <td>ID</td>
          <td>NOME</td>
          <td>DESCRIÇÃO</td>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
  <hr>
  <h3>INSERT</h3>
  <div>
    <form>
      <label>ID:</label>
      <input id="insert-id">
      <label>NOME:</label>
      <input id="insert-nome">
      <label>DESCRIÇÃO:</label>
      <input id="insert-descricao">
      <button type="button" id="insert-btn">INSERT</button>
    </form>
  </div>
</body>

<script>
  const botao = document.getElementById("insert-btn")
  botao.addEventListener("click", insert)

  function insert() {
    const table = document.querySelector("tbody")

    const id = document.createElement("td")
    id.textContent = document.getElementById("insert-id").value
    const nome = document.createElement("td")
    nome.textContent = document.getElementById("insert-nome").value
    const descricao = document.createElement("td")
    descricao.textContent = document.getElementById("insert-descricao").value

    const editButton = document.createElement("button")
    editButton.className = "edit-btn"
    editButton.textContent = "Edit"
    editButton.addEventListener("click", (event) => {
      event.stopPropagation()
      row.innerHTML = `
      <td><input id="edit-id" value="` + id.textContent + `"></td>
      <td><input id="edit-nome" value="` + nome.textContent + `"></td>
      <td><input id="edit-descricao" value="` + descricao.textContent + `"></td>
      <td><button id="save-btn">Save</button></td>
      `
      saveButton = document.getElementById("save-btn")
      saveButton.addEventListener("click", () => {
        id.textContent = document.getElementById("edit-id").value
        nome.textContent = document.getElementById("edit-nome").value
        descricao.textContent = document.getElementById("edit-descricao").value
        row.innerHTML = ""
        row.appendChild(id)
        row.appendChild(nome)
        row.appendChild(descricao)
        row.appendChild(editButton)
        row.appendChild(deleteButton)
      })
    })

    const deleteButton = document.createElement("button")
    deleteButton.className = "delete-btn"
    deleteButton.textContent = "X"
    deleteButton.addEventListener("click", (event) => {
      event.stopPropagation()
      table.removeChild(row)
    })

    const row = document.createElement("tr")
    row.className = "entry"

    row.appendChild(id)
    row.appendChild(nome)
    row.appendChild(descricao)
    row.appendChild(editButton)
    row.appendChild(deleteButton)

    table.appendChild(row)
  }
</script>
