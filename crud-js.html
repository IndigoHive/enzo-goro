<!DOCTYPE html>

<head>
  <style>
    .delete-btn {
      color: red;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      display: none;
    }
    .entry:hover .delete-btn {
      display: inline-block;
    }
  </style>
</head>

<body>
  <h3>TABELA</h3>
  <div>
    <table>
      <thead>
        <tr>
          <td>ID</td>
          <td>NOME</td>
          <td>DESCRIÇÃO</td>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
  <hr>
  <h3>INSERT</h3>
  <div>
    <form>
      <label>ID:</label>
      <input id="insert-id">
      <label>NOME:</label>
      <input id="insert-nome">
      <label>DESCRIÇÃO:</label>
      <input id="insert-descricao">
      <button type="button" id="insert-btn">INSERT</button>
    </form>
  </div>
</body>

<script>
  const botao = document.getElementById("insert-btn")
  botao.addEventListener("click", insert)

  function insert() {
    const table = document.querySelector("tbody")

    const id = document.createElement("td")
    id.textContent = document.getElementById("insert-id").value
    const nome = document.createElement("td")
    nome.textContent = document.getElementById("insert-nome").value
    const descricao = document.createElement("td")
    descricao.textContent = document.getElementById("insert-descricao").value

    const deleteButton = document.createElement("button")
    deleteButton.textContent = "X"
    deleteButton.addEventListener("click", function () {
      table.removeChild(row)
    })
    
    deleteButton.className = "delete-btn"

    const row = document.createElement("tr")
    row.appendChild(id)
    row.appendChild(nome)
    row.appendChild(descricao)
    row.appendChild(deleteButton)
    row.className = "entry"

    table.appendChild(row)
  }

</script>
